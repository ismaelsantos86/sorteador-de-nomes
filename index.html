<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador de Nomes Premium</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --success-color: #10b981;
            --success-hover: #059669;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-sizing: border-box;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .image-container img {
            width: 100%;
            height: auto;
            max-height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            color: var(--primary-color);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 180px;
            padding: 12px 14px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-sortear {
            width: 100%;
            background-color: var(--success-color);
            margin-top: 10px;
            margin-bottom: 10px;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            box-sizing: border-box;
        }

        .btn-sortear:hover {
            background-color: var(--success-hover);
        }

        .btn-reiniciar {
            width: 100%;
            background-color: var(--danger-color);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .btn-reiniciar:hover {
            background-color: var(--danger-hover);
        }

        .list-container {
            text-align: left;
            margin-top: 20px;
            border-top: 2px solid var(--border-color);
            padding-top: 15px;
        }

        .list-container h3 {
            font-size: 1rem;
            color: #4b5563;
            margin-bottom: 10px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            max-height: 160px;
            overflow-y: auto;
            margin: 0;
        }

        ul::-webkit-scrollbar {
            width: 6px;
        }
        ul::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }

        li {
            background-color: #f8fafc;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            word-break: break-word;
            transition: background-color 0.2s;
        }

        li:hover {
            background-color: #f1f5f9;
        }

        .resultado {
            margin-top: 20px;
            margin-bottom: 15px;
            padding: 16px;
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            border: 2px solid #34d399;
            border-radius: 10px;
            font-size: 1.15rem;
            font-weight: bold;
            color: #065f46;
            display: none;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.15);
            animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            word-break: break-word;
        }

        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 400px) {
            .container {
                padding: 16px;
            }
            h1 {
                font-size: 1.3rem;
            }
            .input-group {
                flex-direction: column;
            }
            .input-group button {
                width: 100%;
            }
        }

        /* Estilização do Modal Nativo */
        .modal-custom {
            border: none;
            border-radius: 16px;
            padding: 0;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: fadeInModal 0.3s ease-in-out;
            overflow: hidden;
        }

        .modal-custom::backdrop {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(3px);
        }

        .modal-content {
            padding: 24px;
            text-align: center;
            background-color: var(--card-bg, #ffffff);
            color: var(--text-color, #1f2937);
        }

        .modal-content h3 {
            margin-top: 0;
            color: var(--primary-color, #6366f1);
            font-size: 1.25rem;
        }

        .modal-content p {
            margin-bottom: 20px;
            font-size: 1rem;
            color: #4b5563;
            line-height: 1.5;
        }

        @keyframes fadeInModal {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-secundario {
            background-color: #e5e7eb;
            color: #4b5563;
        }
        .btn-secundario:hover {
            background-color: #d1d5db;
        }

        .btn-primario {
            background-color: var(--danger-color, #ef4444);
            color: white;
        }
        .btn-primario:hover {
            background-color: var(--danger-hover, #dc2626);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-container">
            <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=600&q=80" alt="Ilustração de Sorteio">
        </div>

        <h1>Sorteador de Nomes</h1>

        <div class="input-group">
            <input type="text" id="nomeInput" placeholder="Digite um nome..." autocomplete="off">
            <button id="btnAdicionar">Adicionar</button>
        </div>

        <button class="btn-sortear" id="btnSortear">🎉 Sortear Nome</button>
        <button class="btn-reiniciar" id="btnReiniciar">🔄 Reiniciar Jogo</button>

        <div class="resultado" id="resultadoSorteio"></div>

        <div class="list-container">
            <h3>Participantes (<span id="contador">0</span>)</h3>
            <ul id="listaNomes"></ul>
        </div>
    </div>

    <!-- Biblioteca de Confetes -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="app.js"></script>

    <!-- Modal Único e Inteligente (Sem IDs duplicados) -->
    <dialog id="meuModal" class="modal-custom">
        <div class="modal-content">
            <h3 id="modalTitulo">Aviso</h3>
            <p id="modalMensagem">Mensagem vai aqui...</p>
            
            <div class="modal-buttons" id="modalButtonsContainer">
                <button type="button" id="modalBtnNao" class="btn-secundario">Cancelar</button>
                <button type="button" id="modalBtnSim" class="btn-primario">Confirmar</button>
            </div>
        </div>
    </dialog>

</body>
</html>
